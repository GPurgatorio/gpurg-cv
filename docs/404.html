<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>404 - Quest Not Found | Giulio Purgatorio</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex, nofollow">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }
    .pixel-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.5rem;
      color: #fb923c;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
    }
    h2 {
      font-size: 1.1rem;
      color: #38bdf8;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      background: #fb923c;
      color: #0f172a;
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    .btn:hover {
      transform: scale(1.04);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="pixel-icon">🗺️</div>
    <h1>404</h1>
    <h2>AREA NOT UNLOCKED</h2>
    <p>You ventured beyond the map boundaries. This zone does not exist.</p>
    <a href="/" class="btn">&larr; Return to Spawn</a>
  </div>
</body>
</html>
